<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIVIA RODRIGO — Discografia & YouTube Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="sour">

    <header>
        <div class="tag">★ DISCOGRAFIA COMPLETA ★</div>
        <h1>Olivia Rodrigo</h1>
        <p>Explore as eras, favorite suas faixas e assista aos clipes sem sair da página</p>
    </header>

    <!-- Abas de seleção de álbuns -->
    <nav class="album-selector" id="tabs"></nav>

    <!-- Vitrine principal do álbum selecionado -->
    <main class="container">
        <section class="showcase" id="showcase"></section>
    </main>

    <!-- Modal de Vídeo do YouTube -->
    <div class="modal-overlay" id="videoModal" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Tocando agora</h3>
                <button class="modal-close" id="closeModal" title="Fechar">✕</button>
            </div>
            <div class="video-wrapper" id="videoWrapper"></div>
            <div class="modal-footer">
                <span class="modal-hint">Não carregou? Alguns vídeos oficiais bloqueiam reprodução externa.</span>
                <a id="modalExternalLink" href="#" target="_blank" rel="noopener" class="btn-yt-external">
                    Abrir direto no YouTube ↗
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>Discografia Olivia Rodrigo • Hospedado no GitHub Pages</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
