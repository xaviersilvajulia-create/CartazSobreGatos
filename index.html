<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olivia Rodrigo — Discografia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <header class="top-bar">
            <div class="brand">
                <span class="dot"></span>
                <h1>Olivia Rodrigo</h1>
            </div>
            <nav class="album-tabs" id="tabs" aria-label="Discografia"></nav>
        </header>

        <main class="main-content" id="showcase"></main>

        <footer class="footer">
            <span>Discografia Oficial • Arquivo de Fã</span>
        </footer>
    </div>

    <!-- Modal de Reprodução Limpo -->
    <div class="modal-backdrop" id="videoModal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-top">
                <div class="modal-info">
                    <span class="modal-label">Reproduzindo</span>
                    <h3 id="modalTitle">Nome da Música</h3>
                </div>
                <button class="icon-btn" id="closeModal" aria-label="Fechar">✕</button>
            </div>
            <div class="video-container" id="videoWrapper"></div>
            <div class="modal-bottom">
                <a id="modalExternalLink" href="#" target="_blank" rel="noopener" class="external-link">
                    Assistir no YouTube ↗
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
